name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt
      # The trained checkpoints are not in the repository: tests that need them
      # skip themselves; the stage logic, rule grader, fusion, scheduler and
      # simulation tests run in full.
      - run: python -m pytest backend/tests -q
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
      - run: python -m backend.eval.calibrate --legacy --force
      - name: operating point loads and fingerprint verifies
        run: python -c "from backend.venus.config import operating_point; p = operating_point(); print(p['model_version'], p['thresholds']['referable'])"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
